# AntojApp en modo desarrollo: TODO el proyecto corre en contenedores con el
# codigo fuente montado como volumen. El frontend recarga solo al guardar
# cambios; para ver un cambio en Java hay que reiniciar su servicio:
#   docker compose restart pedidos-service
#
# Los application.properties apuntan a localhost; dentro de la red de Docker
# eso se sobrescribe con variables de entorno (SPRING_DATASOURCE_URL,
# SPRING_KAFKA_BOOTSTRAP_SERVERS, SPRING_MAIL_HOST) hacia los nombres de los
# contenedores.
#
# El primer arranque descarga dependencias de Maven y npm (tarda varios
# minutos); los siguientes reutilizan los volumenes de cache. La version para
# Docker Swarm esta en docker-swarm.yml.
services:
  # SMTP falso para desarrollo local. Los correos NO salen a internet:
  # se consultan en http://localhost:8025
  mailpit:
    image: docker.io/axllent/mailpit:v1.30.5
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # Kafka en modo KRaft (sin ZooKeeper) para desarrollo local.
  # UI opcional: docker compose --profile tools up -d kafka-ui
  kafka:
    image: docker.io/apache/kafka:3.9.0
    restart: unless-stopped
    ports:
      # Los clientes del host (mvn spring-boot:run) usan localhost:9092, que
      # es exactamente lo que el broker anuncia: el mapeo redirige ese
      # puerto al listener EXTERNAL (9094 dentro del contenedor). Es clave
      # que el puerto anunciado y el publicado coincidan, o el productor
      # queda pegado a una direccion muerta hasta reiniciar el servicio.
      - "9092:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      # Marca el contenedor healthy cuando el broker acepta conexiones, para
      # que pedidos y notificaciones arranquen despues de Kafka.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-ui:
    image: docker.io/provectuslabs/kafka-ui:latest
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: antojapp
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  # PostgreSQL con las tres bases del proyecto. El script crea
  # antoj_restaurantes, antoj_pedidos y antoj_notificaciones la primera vez
  # que se inicializa el volumen (despues ya no se ejecuta).
  postgres:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    ports:
      # 5434 en el host: los 5432 y 5433 ya los usan otros proyectos locales.
      # Los microservicios van por la red interna (postgres:5432); este mapeo
      # existe solo para conectar pgAdmin desde el host.
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/crear_bases.sql:/docker-entrypoint-initdb.d/01-crear_bases.sql:ro
    healthcheck:
      # -h 127.0.0.1 fuerza TCP: durante la inicializacion el servidor
      # temporal solo escucha en el socket unix y pg_isready daria un falso
      # positivo antes de que existan las bases.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Microservicios: Maven compila y ejecuta con el codigo montado desde el
  # host. La cache maven-cache se comparte entre los tres para descargar las
  # dependencias una sola vez.
  restaurantes-service:
    image: docker.io/library/maven:3.9-eclipse-temurin-17
    restart: unless-stopped
    working_dir: /app
    command: mvn spring-boot:run
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/antoj_restaurantes
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "1234"
    ports:
      - "8081:8081"
    volumes:
      - ./backend/restaurantes-service:/app
      - maven-cache:/root/.m2

  pedidos-service:
    image: docker.io/library/maven:3.9-eclipse-temurin-17
    restart: unless-stopped
    working_dir: /app
    command: mvn spring-boot:run
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/antoj_pedidos
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "1234"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8082:8082"
    volumes:
      - ./backend/pedidos-service:/app
      - maven-cache:/root/.m2

  notificaciones-service:
    image: docker.io/library/maven:3.9-eclipse-temurin-17
    restart: unless-stopped
    working_dir: /app
    command: mvn spring-boot:run
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/antoj_notificaciones
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "1234"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
    ports:
      - "8083:8083"
    volumes:
      - ./backend/notificaciones-service:/app
      - maven-cache:/root/.m2

  # Angular 19 con recarga en caliente. El volumen nombrado aislana el
  # node_modules del contenedor (Alpine/musl) del que ya existe en el host,
  # que puede tener binarios incompatibles; --poll detecta cambios haciendo
  # polling, que si funciona a traves del volumen montado.
  frontend:
    image: docker.io/library/node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npx ng serve --host 0.0.0.0 --port 4200 --poll 2000"
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

volumes:
  postgres-data:
  maven-cache:
  frontend-node-modules:
