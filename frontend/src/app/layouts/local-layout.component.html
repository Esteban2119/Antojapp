<aside class="sidebar no-print" [class.open]="menuAbierto">
 <div class="side-top">
  <a class="brand light" routerLink="/local/pedidos"><span class="brand-icon"><app-icon name="utensils" [size]="18" [stroke]="2.2" /></span>antoj<span>app</span></a>
  <span class="tag-panel">Panel de restaurante</span>
 </div>
 @if (local.restaurante(); as r) {
  <div class="store">
   <app-media class="store-logo" [src]="r.imagen" [alt]="r.nombre" [texto]="iniciales(r.nombre)" [fondo]="fondo(r.categoria)" />
   <div><b>{{r.nombre}}</b><small>{{r.categoria}}</small></div>
  </div>
 }
 <nav (click)="menuAbierto=false">
  <span class="nav-label">Operación</span>
  <a routerLink="/local/pedidos" routerLinkActive="active"><app-icon name="receipt" [size]="18" />Pedidos</a>
  <a routerLink="/local/productos" routerLinkActive="active"><app-icon name="utensils" [size]="18" />Productos</a>
  <span class="nav-label">Ajustes</span>
  <a routerLink="/local/configuracion" routerLinkActive="active"><app-icon name="settings" [size]="18" />Configuración y pagos</a>
 </nav>
 <div class="side-user">
  <div class="u-avatar">{{iniciales(auth.sesion()?.nombre || '')}}</div>
  <div class="u-info"><b>{{auth.sesion()?.nombre}}</b><small>{{auth.sesion()?.email}}</small></div>
  <button class="u-logout" (click)="auth.logout()" title="Cerrar sesión" aria-label="Cerrar sesión"><app-icon name="logout" [size]="18" /></button>
 </div>
</aside>
<div class="mobile-bar no-print">
 <button class="icon-btn" (click)="menuAbierto=!menuAbierto" aria-label="Menú"><app-icon [name]="menuAbierto ? 'x' : 'menu'" /></button>
 <b>{{local.restaurante()?.nombre || 'Panel'}}</b>
</div>
<main class="content"><router-outlet /></main>
