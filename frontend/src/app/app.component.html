<router-outlet />

@if (notificacion.actual(); as n) {
 <div [class]="'toast no-print ' + n.tipo" role="status">
  <app-icon [name]="n.tipo==='error' ? 'alert' : n.tipo==='info' ? 'bell' : 'checkCircle'" [size]="20" />{{n.texto}}
  <button (click)="notificacion.cerrar()" aria-label="Cerrar"><app-icon name="x" [size]="14" /></button>
 </div>
}
