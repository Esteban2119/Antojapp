# Nombre del microservicio
spring.application.name=pedidos-service

# Puerto
server.port=8082

# Conexion a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/antoj_pedidos
spring.datasource.username=postgres
spring.datasource.password=1234

# Configuracion de JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---------------------------------------------------------------------------
# Kafka: productor de solicitudes de notificacion
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
# No bloquear la API mas de 3 s si el broker no responde.
spring.kafka.producer.properties.max.block.ms=3000
# El consumer usa un tipo por defecto; no hace falta enviar cabeceras de tipo.
spring.kafka.producer.properties.spring.json.add.type.headers=false

pedidos.kafka.topic-notificaciones=notificaciones-solicitadas
# Permite apagar la publicacion (por ejemplo, en pruebas sin broker).
pedidos.kafka.habilitado=true