# Nombre del microservicio
spring.application.name=notificaciones-service

# Puerto
server.port=8083

# Conexion a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/antoj_notificaciones
spring.datasource.username=postgres
spring.datasource.password=1234

# Configuracion de JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Las plantillas viven en la base de datos, no en classpath:/templates
spring.thymeleaf.check-template-location=false

# SMTP local de pruebas: Mailpit (UI en http://localhost:8025)
# Levantalo con: docker compose up -d mailpit
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Remitente de los correos
notificaciones.remitente=AntojApp <no-reply@antojapp.local>

# ---------------------------------------------------------------------------
# Kafka: consumer de solicitudes de notificacion
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notificaciones-service
# earliest permite procesar solicitudes publicadas antes de arrancar el consumer.
spring.kafka.consumer.auto-offset-reset=earliest
# El offset se confirma solo cuando el listener termina sin excepcion.
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ErrorHandlingDeserializer evita que un JSON invalido bloquee la particion:
# delega en JsonDeserializer y convierte el fallo en un error recuperable.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.antojapp.notificaciones.dto.SolicitudNotificacion
spring.kafka.consumer.properties.spring.json.trusted.packages=com.antojapp.notificaciones.dto
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=2

# Productor usado por DeadLetterPublishingRecoverer para publicar en -dlt.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

notificaciones.kafka.topic-solicitudes=notificaciones-solicitadas
notificaciones.kafka.group-id=notificaciones-service
notificaciones.kafka.particiones=3
notificaciones.kafka.replicas=1
# Reintentos despues del primer intento: 3 reintentos = 4 intentos totales.
notificaciones.kafka.reintentos=3
notificaciones.kafka.espera-ms=2000