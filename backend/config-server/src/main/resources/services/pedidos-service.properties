# Kafka: productor de solicitudes de notificacion
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.spring.json.add.type.headers=false

pedidos.kafka.topic-notificaciones=notificaciones-solicitadas
pedidos.kafka.habilitado=true

# Codigos de plantilla de notificacion por estado de pedido
pedidos.notificaciones.plantillas.RECIBIDO=PEDIDO_RECIBIDO
pedidos.notificaciones.plantillas.CONFIRMADO=PEDIDO_CONFIRMADO
pedidos.notificaciones.plantillas.EN_CAMINO=PEDIDO_EN_CAMINO
pedidos.notificaciones.plantillas.ENTREGADO=PEDIDO_ENTREGADO
pedidos.notificaciones.plantillas.RECHAZADO=PEDIDO_RECHAZADO
